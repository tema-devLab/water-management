<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>agence du bassin hydraulique oum rbia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="conteneur">
<h1>agence du bassin hydraulique oum rbia</h1>

<div class="grille-cartes">

  <div class="carte">
    <h2>Créer un compte</h2>
    <input type="text" id="nom" placeholder="Nom">
    <input type="text" id="prenom" placeholder="Prénom">
    <input type="text" id="username" placeholder="Nom d'utilisateur">
    <input type="password" id="password" placeholder="Mot de passe">
    <button onclick="creerCompte()">Créer mon compte</button>
    <p id="statutCompte"></p>
  </div>

  <div class="carte">
    <h2>Soumettre une demande</h2>
    <input type="text" id="objet" placeholder="Objet de la demande">
    <select id="type_demande">
        <option value="autorisation">Autorisation</option>
        <option value="reclamation">Réclamation</option>
    </select>
    <button onclick="envoyerDemande()">Envoyer la demande</button>
    <p id="resultatDemande"></p>
  </div>

  <div class="carte carte-suivi">
    <h2>Suivre ma demande</h2>
    <input type="text" id="numeroSuivi" placeholder="Numéro de suivi (DEM-XXXXXXXX)">
    <button onclick="suivreDemande()">Vérifier le statut</button>
    <p id="resultatSuivi"></p>
  </div>

</div>
</div>

<!-- Bouton rond employé -->
<div class="bouton-rond" onclick="toggleEmploye()">👤</div>
<div class="panneau-employe" id="panneauEmploye">
    <h2 style="font-size:0.95rem;margin-top:0;">Connexion employé</h2>
    <input type="text" id="user" placeholder="Nom d'utilisateur">
    <input type="password" id="pass" placeholder="Mot de passe">
    <button onclick="loginEmploye()">Se connecter</button>
    <p id="statutLogin"></p>
</div>

<script>
function toggleEmploye() {
    document.getElementById("panneauEmploye").classList.toggle("actif");
}

function creerCompte() {
    fetch("http://127.0.0.1:5000/api/citoyen/inscription", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            nom: document.getElementById("nom").value,
            prenom: document.getElementById("prenom").value,
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        })
    })
    .then(res => res.json())
    .then(data => { document.getElementById("statutCompte").innerText = data.message; })
    .catch(() => { document.getElementById("statutCompte").innerText = "Erreur de connexion."; });
}

function envoyerDemande() {
    fetch("http://127.0.0.1:5000/api/demandes", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            objet: document.getElementById("objet").value,
            type_demande: document.getElementById("type_demande").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("resultatDemande").innerText =
            data.numero_suivi ? "Numéro : " + data.numero_suivi : data.message;
    })
    .catch(() => { document.getElementById("resultatDemande").innerText = "Erreur de connexion."; });
}

function suivreDemande() {
    let numero = document.getElementById("numeroSuivi").value;
    fetch("http://127.0.0.1:5000/api/suivi/" + numero)
    .then(res => res.json())
    .then(data => {
        document.getElementById("resultatSuivi").innerText =
            data.statut ? "Statut : " + data.statut : data.message;
    })
    .catch(() => { document.getElementById("resultatSuivi").innerText = "Erreur de connexion."; });
}

function loginEmploye() {
    fetch("http://127.0.0.1:5000/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({
            username: document.getElementById("user").value,
            password: document.getElementById("pass").value
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("statutLogin").innerText = data.message;
        if (data.message === "Connexion réussie") window.location.href = "/employe.html";
    });
}
</script>
</body>
</html>
